<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 경제 뉴스 해설사</title>
  
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', Arial, sans-serif; }
    body { margin: 0; background: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #1a237e; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
    
    .section { margin-bottom: 25px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 12px; background: #fafafa; }
    .section-title { font-weight: bold; font-size: 16px; margin-bottom: 12px; color: #1a237e; display: flex; align-items: center; justify-content: space-between; }
    
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
    button { background: #1a237e; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #283593; opacity: 0.9; }
    button:disabled { background: #9e9e9e; cursor: not-allowed; }
    .btn-secondary { background: #5c6bc0; }
    .btn-secondary:hover { background: #3f51b5; }
    .btn-success { background: #2e7d32; }
    .btn-success:hover { background: #1b5e20; }
    
    .flex-row { display: flex; gap: 10px; }
    .news-list { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; background: white; padding: 5px; margin-top: 10px; }
    .news-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.1s; }
    .news-item:hover { background: #e8eaf6; }
    .news-item.selected { background: #c5cae9; font-weight: bold; }
    
    .output-box { min-height: 120px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
    .status { font-size: 13px; color: #666; margin-top: 5px; min-height: 20px; text-align: right; }
    .user-info { font-size: 14px; color: #333; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  <h1>AI 경제 뉴스 해설사</h1>
  <div class="subtitle">구글 로그인부터 뉴스 검색, GPT 해설, TTS 리딩 및 Firestore 저장까지</div>

  <div class="section">
    <div class="section-title">
      <span>1. 구글 인증</span>
      <span id="userInfo" class="user-info">로그인 필요</span>
    </div>
    <button id="loginBtn">구글 계정으로 로그인</button>
  </div>

  <div class="section">
    <div class="section-title">2. 경제 뉴스 검색 및 선택</div>
    <div class="flex-row">
      <input type="text" id="searchKeyword" placeholder="예: 삼성전자 반도체, 금리 인상, 환율 등">
      <button id="searchBtn">뉴스 검색</button>
    </div>
    <div id="newsList" class="news-list" style="display:none;"></div>
  </div>

  <div class="section">
    <div class="section-title">3. GPT 경제 해설 생성 및 오디오 리딩</div>
    <button id="gptBtn" class="btn-secondary" disabled>GPT 해설 및 TTS 오디오 생성</button>
    <div style="margin-top: 15px;">
      <div style="font-weight: bold; margin-bottom: 5px;">[GPT 해설 결과]</div>
      <div id="explanationOutput" class="output-box">뉴스를 선택하고 해설을 요청하세요.</div>
    </div>
    <div style="margin-top: 15px; display: none;" id="audioPlayerContainer">
      <div style="font-weight: bold; margin-bottom: 5px;">[TTS 음성 리딩]</div>
      <audio id="ttsAudio" controls style="width: 100%;"></audio>
    </div>
  </div>

  <div class="section">
    <div class="section-title">4. 나만의 뉴스 해설 노트에 저장</div>
    <button id="saveBtn" class="btn-success" disabled>현재 해설 Firestore에 저장하기</button>
  </div>

  <div id="statusMessage" class="status"></div>
</div>

<script type="module">
  // Firebase 라이브러리 기능 가져오기
  import { initializeApp } from "firebase/app";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "firebase/auth";
  import { getFirestore, collection, addDoc } from "firebase/firestore";

  // ⚠️ [필수 입력 1] 본인의 Firebase 웹 앱 SDK 설정값으로 대체하세요.
  const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // ⚠️ [필수 입력 2] 본인의 OpenAI API 비밀 키를 입력하세요.
  const OPENAI_API_KEY = "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";

  // Firebase 및 서비스 초기화
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // 전역 상태 변수
  let currentUser = null;
  let selectedNews = null;
  let currentExplanation = "";

  // DOM 요소 참조
  const loginBtn = document.getElementById('loginBtn');
  const userInfo = document.getElementById('userInfo');
  const searchKeyword = document.getElementById('searchKeyword');
  const searchBtn = document.getElementById('searchBtn');
  const newsList = document.getElementById('newsList');
  const gptBtn = document.getElementById('gptBtn');
  const explanationOutput = document.getElementById('explanationOutput');
  const audioPlayerContainer = document.getElementById('audioPlayerContainer');
  const ttsAudio = document.getElementById('ttsAudio');
  const saveBtn = document.getElementById('saveBtn');
  const statusMessage = document.getElementById('statusMessage');

  function setStatus(msg) { statusMessage.textContent = msg; }

  // [기능 1] 구글 로그인 연동 및 상태 감지
  loginBtn.addEventListener('click', async () => {
    try {
      setStatus("구글 로그인 팝업 창을 여는 중...");
      await signInWithPopup(auth, provider);
    } catch (error) {
      console.error(error);
      alert("로그인 실패: " + error.message);
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      userInfo.textContent = `사용자: ${user.displayName} (${user.email})`;
      loginBtn.textContent = "로그인 완료";
      loginBtn.disabled = true;
      setStatus("구글인증 완료. 뉴스를 검색해 보세요.");
    } else {
      currentUser = null;
      userInfo.textContent = "로그인 필요";
      loginBtn.disabled = false;
    }
  });

  // [기능 2] 뉴스 검색 (클라이언트 단에서 AllOrigins 프록시를 이용해 Google RSS 크롤링 CORS 우회)
  searchBtn.addEventListener('click', async () => {
    const keyword = searchKeyword.value.trim();
    if(!keyword) return alert("검색어를 입력하세요.");

    setStatus("실시간 뉴스를 가져오는 중입니다...");
    newsList.innerHTML = "검색 중...";
    newsList.style.display = "block";

    try {
      const targetUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(keyword + " 경제")}&hl=ko&gl=KR&ceid=KR:ko`;
      // 프론트엔드 직접 크롤링 시 발생하는 CORS 방지를 위한 무료 프록시 사용
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
      
      const response = await fetch(proxyUrl);
      const json = await response.json();
      
      // XML 파싱
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(json.contents, "text/xml");
      const items = xmlDoc.getElementsByTagName("item");

      newsList.innerHTML = "";
      if(items.length === 0) {
        newsList.innerHTML = "<div class='news-item'>검색 결과가 없습니다.</div>";
        return;
      }

      // 최대 7개 노출
      const limit = Math.min(items.length, 7);
      for(let i = 0; i < limit; i++) {
        const title = items[i].getElementsByTagName("title")[0]?.textContent || "";
        const link = items[i].getElementsByTagName("link")[0]?.textContent || "";
        const pubDate = items[i].getElementsByTagName("pubDate")[0]?.textContent || "";
        
        const div = document.createElement('div');
        div.className = 'news-item';
        div.innerHTML = `<strong>${title}</strong><br><small style="color:#666">${pubDate}</small>`;
        
        div.onclick = () => {
          document.querySelectorAll('.news-item').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          selectedNews = { title, link };
          gptBtn.disabled = false;
          setStatus(`선택된 뉴스: ${title}`);
        };
        newsList.appendChild(div);
      }
      setStatus("검색 완료. 해설을 원하는 뉴스를 선택하세요.");
    } catch (e) {
      console.error(e);
      newsList.innerHTML = "뉴스 수집 실패";
      setStatus("뉴스 검색 중 오류가 발생했습니다.");
    }
  });

  // [기능 3] GPT 설명 생성 (Fetch API 호출)
  gptBtn.addEventListener('click', async () => {
    if(!selectedNews) return;
    setStatus("OpenAI GPT 해설 문장을 생성하는 중...");
    explanationOutput.textContent = "AI가 작성 중입니다...";
    gptBtn.disabled = true;

    try {
      const prompt = `너는 친절하고 전문적인 경제 뉴스 해설사야. 다음 경제 뉴스의 제목을 보고, 고등학생도 직관적으로 이해할 수 있도록 쉬운 예시를 들어 3문장 이내로 명쾌하게 설명해줘.\n\n뉴스 제목: ${selectedNews.title}`;
      
      const gptResponse = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${OPENAI_API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.7
        })
      });

      const gptData = await gptResponse.json();
      if(gptData.error) throw new Error(gptData.error.message);

      currentExplanation = gptData.choices[0].message.content.trim();
      explanationOutput.textContent = currentExplanation;
      
      // 해설이 완료되면 연속으로 TTS 오디오 생성 트리거
      await generateTTS(currentExplanation);
      
      saveBtn.disabled = false;
      gptBtn.disabled = false;
    } catch(e) {
      console.error(e);
      explanationOutput.textContent = "GPT 생성 에러: " + e.message;
      gptBtn.disabled = false;
      setStatus("오류 발생");
    }
  });

  // [기능 4] TTS 읽기 생성 (Fetch API 호출)
  async function generateTTS(text) {
    setStatus("설명에 대한 AI 음성 가이드를 생성하는 중...");
    try {
      const ttsResponse = await fetch("https://api.openai.com/v1/audio/speech", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${OPENAI_API_KEY}`
        },
        body: JSON.stringify({
          model: "tts-1",
          input: text,
          voice: "alloy"
        })
      });

      if (!ttsResponse.ok) throw new Error("TTS 호출 에러");

      const audioBlob = await ttsResponse.blob();
      const audioUrl = URL.createObjectURL(audioBlob);
      
      ttsAudio.src = audioUrl;
      audioPlayerContainer.style.display = "block";
      setStatus("해설 도출 및 TTS 음성 합성이 모두 완료되었습니다!");
    } catch(e) {
      console.error(e);
      setStatus("TTS 생성 실패 (텍스트 해설은 사용 가능)");
    }
  }

  // [기능 5] Firestore에 바로 저장하기
saveBtn.addEventListener('click', async () => {
  // 걍 로그인 체크 안 하고 바로 저장하기!
  if(!selectedNews || !currentExplanation) return;
  
  setStatus("데이터베이스에 기록 중...");
  saveBtn.disabled = true;

  try {
    await addDoc(collection(db, "news_notes"), {
      userEmail: currentUser ? currentUser.email : "guest@test.com", // 로그인 안 했으면 게스트로 처리
      userName: currentUser ? currentUser.displayName : "방문자",
      newsTitle: selectedNews.title,
      newsLink: selectedNews.link,
      explanation: currentExplanation,
      savedAt: new Date().toISOString()
    });

    alert("성공적으로 저장되었습니다!");
    setStatus("저장 완료.");
  } catch(e) {
    console.error(e);
    alert("저장 오류: " + e.message);
    saveBtn.disabled = false;
  }
});
</script>
</body>
</html>
