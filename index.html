<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 경제_뉴스_해설사</title>
  
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', Arial, sans-serif; }
    body { margin: 0; background: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #1a237e; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
    .section { margin-bottom: 25px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 12px; background: #fafafa; }
    .section-title { font-weight: bold; font-size: 16px; margin-bottom: 12px; color: #1a237e; display: flex; align-items: center; justify-content: space-between; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
    button { background: #1a237e; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #283593; opacity: 0.9; }
    button:disabled { background: #9e9e9e; cursor: not-allowed; }
    .btn-secondary { background: #5c6bc0; }
    .btn-secondary:hover { background: #3f51b5; }
    .btn-success { background: #2e7d32; }
    .btn-success:hover { background: #1b5e20; }
    .flex-row { display: flex; gap: 10px; }
    .auth-box { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; max-width: 400px; }
    .or-divider { margin: 10px 0; text-align: center; color: #888; font-size: 13px; }
    .news-list { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; background: white; padding: 5px; margin-top: 10px; }
    .news-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
    .news-item:hover { background: #e8eaf6; }
    .news-item.selected { background: #c5cae9; font-weight: bold; }
    .output-box { min-height: 120px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
    .status { font-size: 13px; color: #666; margin-top: 5px; min-height: 20px; text-align: right; }
    .user-info { font-size: 14px; color: #333; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  <h1>AI 경제 뉴스 해설사</h1>
  <div class="subtitle">Firebase 보안 데이터베이스 연동 및 깃허브 키 노출 차단 버전</div>

  <div class="section">
    <div class="section-title">
      <span>1. 사용자 인증</span>
      <span id="userInfo" class="user-info">로그인 필요 (로그인 안 해도 사용 가능)</span>
    </div>
    <div id="authForm" class="auth-box">
      <input type="email" id="authEmail" placeholder="이메일 주소 입력">
      <input type="password" id="authPassword" placeholder="비밀번호 입력 (6자리 이상)">
      <div class="flex-row">
        <button id="emailSignUpBtn" class="btn-secondary" style="flex: 1;">이메일로 회원가입</button>
        <button id="emailSignInBtn" style="flex: 1;">이메일로 로그인</button>
      </div>
    </div>
    <div id="orDivider" class="or-divider">— 또는 —</div>
    <button id="googleLoginBtn">구글 계정으로 로그인</button>
    <button id="logoutBtn" class="btn-secondary" style="display: none;">로그아웃</button>
  </div>

  <div class="section">
    <div class="section-title">2. 경제 뉴스 검색 또는 직접 입력</div>
    <div class="flex-row">
      <input type="text" id="searchKeyword" placeholder="예: 삼성전자 반도체, 금리 인상 등">
      <button id="searchBtn">뉴스 검색</button>
    </div>
    <div id="newsList" class="news-list" style="display:none;"></div>
    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc;">
      <input type="text" id="directTitleInput" placeholder="여기에 뉴스 제목을 붙여넣으세요.">
      <div class="flex-row">
        <input type="text" id="directUrlInput" placeholder="여기에 뉴스 기사 URL을 붙여넣으세요.">
        <button id="directApplyBtn" class="btn-secondary" style="white-space: nowrap;">이 뉴스 선택</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">3. GPT 경제 해설 생성 및 오디오 리딩</div>
    <button id="gptBtn" class="btn-secondary" disabled>GPT 해설 및 TTS 오디오 생성</button>
    <div style="margin-top: 15px;">
      <div style="font-weight: bold; margin-bottom: 5px;">[GPT 해설 결과]</div>
      <div id="explanationOutput" class="output-box">뉴스를 선택하고 해설을 요청하세요.</div>
    </div>
    <div style="margin-top: 15px; display: none;" id="audioPlayerContainer">
      <div style="font-weight: bold; margin-bottom: 5px;">[TTS 음성 리딩]</div>
      <audio id="ttsAudio" controls style="width: 100%;"></audio>
    </div>
  </div>

  <div class="section">
    <div class="section-title">4. 나만의 뉴스 해설 노트에 저장</div>
    <button id="saveBtn" class="btn-success" disabled>현재 해설 DB에 저장하기</button>
  </div>

  <div id="statusMessage" class="status">보안 키 로딩 대기 중...</div>
</div>

<script type="module">
  import { initializeApp } from "firebase/app";
  import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "firebase/auth";
  import { getDatabase, ref, get, child, push } from "firebase/database";

  // ⚠️ 본인의 파이어베이스 설정을 여기에 정확히 채워 넣으세요!
const firebaseConfig = {
  apiKey: "AIzaSyDIw9QBT1IohdQWoqwQyKyuOFKy_5A0r0k",
  authDomain: "connect-bde66.firebaseapp.com",
  databaseURL: "https://connect-bde66-default-rtdb.firebaseio.com",
  projectId: "connect-bde66",
  storageBucket: "connect-bde66.firebasestorage.app",
  messagingSenderId: "496355380495",
  appId: "1:496355380495:web:716eed867ba27186df827a",
  measurementId: "G-HDVXCH589F"
};

  // Firebase 및 인증 서비스 초기화
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const database = getDatabase(app);
  const provider = new GoogleAuthProvider();

  // 🔐 변수 선언 (여기는 절대 손대지 마세요! 파이어베이스가 자동으로 키를 불러와 저장할 공간입니다.)
  let OPENAI_API_KEY = ""; 

  let currentUser = null;
  let selectedNews = null;
  let currentExplanation = "";

  const userInfo = document.getElementById('userInfo');
  const authForm = document.getElementById('authForm');
  const orDivider = document.getElementById('orDivider');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const emailSignUpBtn = document.getElementById('emailSignUpBtn');
  const emailSignInBtn = document.getElementById('emailSignInBtn');
  const googleLoginBtn = document.getElementById('googleLoginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const searchKeyword = document.getElementById('searchKeyword');
  const searchBtn = document.getElementById('searchBtn');
  const newsList = document.getElementById('newsList');
  const directTitleInput = document.getElementById('directTitleInput');
  const directUrlInput = document.getElementById('directUrlInput');
  const directApplyBtn = document.getElementById('directApplyBtn');
  const gptBtn = document.getElementById('gptBtn');
  const explanationOutput = document.getElementById('explanationOutput');
  const audioPlayerContainer = document.getElementById('audioPlayerContainer');
  const ttsAudio = document.getElementById('ttsAudio');
  const saveBtn = document.getElementById('saveBtn');
  const statusMessage = document.getElementById('statusMessage');

  function setStatus(msg) { statusMessage.textContent = msg; }

  // 🔑 [핵심 로직] 웹사이트가 켜지자마자 파이어베이스 DB에서 키를 훔쳐오기
  async function loadSecureApiKey() {
    try {
      const dbRef = ref(database);
      const snapshot = await get(child(dbRef, 'openai_key'));
      if (snapshot.exists()) {
        OPENAI_API_KEY = snapshot.val();
        setStatus("보안 검증 완료. 시스템 가동 준비 완료!");
      } else {
        setStatus("⚠️ 파이어베이스 DB에 'openai_key'가 없습니다!");
      }
    } catch (e) {
      console.error(e);
      setStatus("보안 키 로드 실패: 규칙(Rules) 설정을 확인하세요.");
    }
  }
  loadSecureApiKey(); // 웹 페이지 로딩 시 자동 실행

  // Firebase 사용자 인증 모듈
  emailSignUpBtn.addEventListener('click', async () => {
    const email = authEmail.value.trim(); const password = authPassword.value;
    if(!email || !password) return alert("이메일과 비밀번호를 입력하세요.");
    try { await createUserWithEmailAndPassword(auth, email, password); alert("가입 성공!"); } catch(e) { alert(e.message); }
  });
  emailSignInBtn.addEventListener('click', async () => {
    const email = authEmail.value.trim(); const password = authPassword.value;
    if(!email || !password) return alert("이메일과 비밀번호를 입력하세요.");
    try { await signInWithEmailAndPassword(auth, email, password); alert("로그인 성공!"); } catch(e) { alert(e.message); }
  });
  googleLoginBtn.addEventListener('click', async () => { try { await signInWithPopup(auth, provider); } catch (e) { alert(e.message); } });
  logoutBtn.addEventListener('click', () => { signOut(auth); });
  onAuthStateChanged(auth, (user) => {
    if (user) { currentUser = user; userInfo.textContent = `접속: ${user.email}`; authForm.style.display = "none"; orDivider.style.display = "none"; googleLoginBtn.style.display = "none"; logoutBtn.style.display = "block"; } 
    else { currentUser = null; userInfo.textContent = "게스트 상태"; authForm.style.display = "flex"; orDivider.style.display = "block"; googleLoginBtn.style.display = "block"; logoutBtn.style.display = "none"; }
  });

  // RSS 뉴스 검색 엔진
  searchBtn.addEventListener('click', async () => {
    const keyword = searchKeyword.value.trim();
    if(!keyword) return alert("검색어를 입력해 주세요.");
    newsList.innerHTML = "뉴스 데이터를 로드하고 있습니다..."; newsList.style.display = "block";
    try {
      const googleNewsUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(keyword + " 경제")}&hl=ko&gl=KR&ceid=KR:ko`;
      const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(googleNewsUrl)}`);
      const data = await response.json();
      newsList.innerHTML = "";
      data.items.slice(0, 6).forEach(item => {
        const div = document.createElement('div'); div.className = 'news-item'; div.innerHTML = `<strong>${item.title}</strong>`;
        div.onclick = () => {
          document.querySelectorAll('.news-item').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected'); selectedNews = { title: item.title, link: item.link, isUrlOnly: false }; gptBtn.disabled = false; setStatus(`뉴스 선택됨: ${item.title}`);
        };
        newsList.appendChild(div);
      });
    } catch (e) { newsList.innerHTML = "<div class='news-item' style='color:#c62828;'>⚠️ 수동 입력을 이용하세요!</div>"; }
  });

  directApplyBtn.addEventListener('click', () => {
    let title = directTitleInput.value.trim(); const url = directUrlInput.value.trim();
    if(!title && !url) return alert("값을 채워주세요!");
    let isUrlOnlyMode = !title && url;
    if(isUrlOnlyMode) { try { title = `${new URL(url).hostname} 뉴스`; } catch { title = "수동 뉴스"; } }
    selectedNews = { title, link: url || `https://search.naver.com/search.naver?query=${encodeURIComponent(title)}`, isUrlOnly: isUrlOnlyMode };
    gptBtn.disabled = false; alert("뉴스 선택 완료!");
  });

  // 🚀 파이어베이스에서 실시간으로 긁어온 API 키로 OpenAI 호출
  gptBtn.addEventListener('click', async () => {
    if(!selectedNews) return;
    if(!OPENAI_API_KEY) return alert("아직 파이어베이스에서 보안 API 키를 불러오지 못했습니다. 잠시만 기다려주세요!");
    
    setStatus("GPT 엔진 가동 및 경제 해설 답변 생성 중...");
    explanationOutput.textContent = "OpenAI 서버와 통신 중..."; gptBtn.disabled = true;

    try {
      let prompt = selectedNews.isUrlOnly 
        ? `경제 뉴스 기사 주소(${selectedNews.link})를 참고하여 고등학생이 알기 쉽게 핵심 상식을 3문장 이내로 해설해줘.`
        : `경제 뉴스 제목 [${selectedNews.title}]을 보고 검색해서 알아보고 고등학생도 직관적으로 이해하도록 쉬운 예시를 들어 뉴스의 내용을 해설해줘.`;

      const response = await fetch("https://corsproxy.io/?https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${OPENAI_API_KEY}` },
        body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: prompt }], temperature: 0.7 })
      });

      const data = await response.json();
      if(!response.ok) throw new Error(data.error?.message || "GPT 통신 실패");

      currentExplanation = data.choices[0].message.content;
      explanationOutput.textContent = currentExplanation;
      
      await generateTTS(currentExplanation);
      saveBtn.disabled = false;
    } catch(e) { explanationOutput.textContent = "GPT 연동 실패: " + e.message; }
    gptBtn.disabled = false;
  });

  // OpenAI TTS 오디오 합성
// 🚀 OpenAI TTS 오디오 데이터 수신 함수
async function generateTTS(text) {
  setStatus("OpenAI 가속 서버에서 TTS 음성 리딩 파일 인코딩 중...");
  try {
    const response = await fetch("https://corsproxy.io/?https://api.openai.com/v1/audio/speech", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${OPENAI_API_KEY}` // ◀ 파이어베이스에서 긁어온 키가 들어가는 곳!
      },
      body: JSON.stringify({
        model: "tts-1",    // OpenAI 오디오 인공지능 모델
        input: text,       // gpt가 만든 해설 텍스트
        voice: "alloy"     // 목소리 타입 (alloy)
      })
    });

    if (!response.ok) throw new Error();

    const blob = await response.blob();
    ttsAudio.src = URL.createObjectURL(blob); // ◀ 오디오 태그에 음성 파일 주입!
    audioPlayerContainer.style.display = "block"; // ◀ 플레이어 화면에 보이기
    setStatus("모든 AI 브리핑 시스템이 매끄럽게 완료되었습니다!");
  } catch(e) {
    setStatus("텍스트 생성 성공 (오디오 변환 오류)");
  }
}
  saveBtn.addEventListener('click', async () => {
    if(!selectedNews || !currentExplanation) return;
    try {
      await push(ref(database, 'news_notes'), { userEmail: currentUser?currentUser.email:"guest_user", newsTitle: selectedNews.title, newsLink: selectedNews.link, explanation: currentExplanation, savedAt: new Date().toISOString() });
      alert("해설 노트에 보관되었습니다!");
    } catch(e) { alert("저장 실패: " + e.message); }
  });
</script>
</body>
</html>
