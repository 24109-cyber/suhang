<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 경제 뉴스 해설사</title>
  
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
      }
    }
  </script>
#
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', Arial, sans-serif; }
    body { margin: 0; background: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: #1a237e; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
    
    .section { margin-bottom: 25px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 12px; background: #fafafa; }
    .section-title { font-weight: bold; font-size: 16px; margin-bottom: 12px; color: #1a237e; display: flex; align-items: center; justify-content: space-between; }
    
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
    button { background: #1a237e; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #283593; opacity: 0.9; }
    button:disabled { background: #9e9e9e; cursor: not-allowed; }
    .btn-secondary { background: #5c6bc0; }
    .btn-secondary:hover { background: #3f51b5; }
    .btn-success { background: #2e7d32; }
    .btn-success:hover { background: #1b5e20; }
    
    .flex-row { display: flex; gap: 10px; }
    .auth-box { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; max-width: 400px; }
    .or-divider { margin: 10px 0; text-align: center; color: #888; font-size: 13px; position: relative; }
    
    .news-list { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; background: white; padding: 5px; margin-top: 10px; }
    .news-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.1s; }
    .news-item:hover { background: #e8eaf6; }
    .news-item.selected { background: #c5cae9; font-weight: bold; }
    
    .output-box { min-height: 120px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
    .status { font-size: 13px; color: #666; margin-top: 5px; min-height: 20px; text-align: right; }
    .user-info { font-size: 14px; color: #333; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  <h1>AI 경제 뉴스 해설사</h1>
  <div class="subtitle">GitHub Actions Secrets 치트키로 API 보안 강화를 마친 최종 마스터 버전</div>

  <div class="section">
    <div class="section-title">
      <span>1. 사용자 인증</span>
      <span id="userInfo" class="user-info">로그인 필요 (로그인 안 해도 사용 가능)</span>
    </div>
    
    <div id="authForm" class="auth-box">
      <input type="email" id="authEmail" placeholder="이메일 주소 입력">
      <input type="password" id="authPassword" placeholder="비밀번호 입력 (6자리 이상)">
      <div class="flex-row">
        <button id="emailSignUpBtn" class="btn-secondary" style="flex: 1;">이메일로 회원가입</button>
        <button id="emailSignInBtn" style="flex: 1;">이메일로 로그인</button>
      </div>
    </div>

    <div id="orDivider" class="or-divider">— 또는 —</div>
    
    <button id="googleLoginBtn">구글 계정으로 로그인</button>
    <button id="logoutBtn" class="btn-secondary" style="display: none;">로그아웃</button>
  </div>

  <div class="section">
    <div class="section-title">2. 경제 뉴스 검색 또는 직접 입력 (URL 단독 가능)</div>
    
    <div class="flex-row">
      <input type="text" id="searchKeyword" placeholder="예: 삼성전자 반도체, 금리 인상, 환율 등">
      <button id="searchBtn">뉴스 검색</button>
    </div>
    <div id="newsList" class="news-list" style="display:none;"></div>

    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc;">
      <div style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #555;">
        ⚠️ 뉴스 검색이 안 되나요? 뉴스 제목 혹은 기사 링크(URL)만 직접 붙여넣으세요!
      </div>
      <input type="text" id="directTitleInput" placeholder="여기에 뉴스 제목을 복사해서 붙여넣으세요. (생략 가능)">
      <div class="flex-row">
        <input type="text" id="directUrlInput" placeholder="여기에 뉴스 기사 URL(링크)을 붙여넣으세요.">
        <button id="directApplyBtn" class="btn-secondary" style="white-space: nowrap;">이 뉴스 선택</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">3. GPT 경제 해설 생성 및 오디오 리딩</div>
    <button id="gptBtn" class="btn-secondary" disabled>GPT 해설 및 TTS 오디오 생성</button>
    <div style="margin-top: 15px;">
      <div style="font-weight: bold; margin-bottom: 5px;">[GPT 해설 결과]</div>
      <div id="explanationOutput" class="output-box">뉴스를 선택하고 해설을 요청하세요.</div>
    </div>
    <div style="margin-top: 15px; display: none;" id="audioPlayerContainer">
      <div style="font-weight: bold; margin-bottom: 5px;">[TTS 음성 리딩]</div>
      <audio id="ttsAudio" controls style="width: 100%;"></audio>
    </div>
  </div>

  <div class="section">
    <div class="section-title">4. 나만의 뉴스 해설 노트에 저장</div>
    <button id="saveBtn" class="btn-success" disabled>현재 해설 DB에 저장하기</button>
  </div>

  <div id="statusMessage" class="status"></div>
</div>

<script type="module">
  import { initializeApp } from "firebase/app";
  import { 
    getAuth, 
    signInWithPopup, 
    GoogleAuthProvider, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    signOut,
    onAuthStateChanged 
  } from "firebase/auth";
  import { getDatabase, ref, push } from "firebase/database";

  // ⚠️ 본인의 파이어베이스 설정을 여기에 알맞게 채워 넣으세요!
const firebaseConfig = {
  apiKey: "AIzaSyDIw9QBT1IohdQWoqwQyKyuOFKy_5A0r0k",
  authDomain: "connect-bde66.firebaseapp.com",
  databaseURL: "https://connect-bde66-default-rtdb.firebaseio.com",
  projectId: "connect-bde66",
  storageBucket: "connect-bde66.firebasestorage.app",
  messagingSenderId: "496355380495",
  appId: "1:496355380495:web:716eed867ba27186df827a",
  measurementId: "G-HDVXCH589F"
};
  // 🔒 GitHub Actions가 배포할 때 진짜 키로 변환해 주는 보안 치트키 문자열입니다. 수정 금지!
  const OPENAI_API_KEY = "__OPENAI_API_KEY__";

  // Firebase 및 인증 서비스 초기화
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const database = getDatabase(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let selectedNews = null;
  let currentExplanation = "";

  const userInfo = document.getElementById('userInfo');
  const authForm = document.getElementById('authForm');
  const orDivider = document.getElementById('orDivider');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const emailSignUpBtn = document.getElementById('emailSignUpBtn');
  const emailSignInBtn = document.getElementById('emailSignInBtn');
  const googleLoginBtn = document.getElementById('googleLoginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  
  const searchKeyword = document.getElementById('searchKeyword');
  const searchBtn = document.getElementById('searchBtn');
  const newsList = document.getElementById('newsList');

  const directTitleInput = document.getElementById('directTitleInput');
  const directUrlInput = document.getElementById('directUrlInput');
  const directApplyBtn = document.getElementById('directApplyBtn');

  const gptBtn = document.getElementById('gptBtn');
  const explanationOutput = document.getElementById('explanationOutput');
  const audioPlayerContainer = document.getElementById('audioPlayerContainer');
  const ttsAudio = document.getElementById('ttsAudio');
  const saveBtn = document.getElementById('saveBtn');
  const statusMessage = document.getElementById('statusMessage');

  function setStatus(msg) { statusMessage.textContent = msg; }

  emailSignUpBtn.addEventListener('click', async () => {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if(!email || !password) return alert("이메일과 비밀번호를 모두 입력하세요.");
    setStatus("회원 계정 생성 요청 중...");
    try {
      await createUserWithEmailAndPassword(auth, email, password);
      alert("회원가입 및 로그인에 성공했습니다!");
    } catch(e) {
      alert("가입 오류: " + e.message);
    }
  });

  emailSignInBtn.addEventListener('click', async () => {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if(!email || !password) return alert("이메일과 비밀번호를 모두 입력하세요.");
    setStatus("이메일 계정 검증 중...");
    try {
      await signInWithEmailAndPassword(auth, email, password);
      alert("성공적으로 로그인되었습니다!");
    } catch(e) {
      alert("로그인 오류: " + e.message);
    }
  });

  googleLoginBtn.addEventListener('click', async () => {
    try {
      setStatus("구글 팝업 인증을 대기 중입니다...");
      await signInWithPopup(auth, provider);
    } catch (e) {
      alert("구글 로그인 실패: " + e.message);
    }
  });

  logoutBtn.addEventListener('click', () => {
    signOut(auth).then(() => alert("로그아웃 되었습니다."));
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      userInfo.textContent = `접속 상태: ${user.email}`;
      authForm.style.display = "none";
      orDivider.style.display = "none";
      googleLoginBtn.style.display = "none";
      logoutBtn.style.display = "block";
    } else {
      currentUser = null;
      userInfo.textContent = "로그인 없이 게스트로 사용 가능";
      authForm.style.display = "flex";
      orDivider.style.display = "block";
      googleLoginBtn.style.display = "block";
      logoutBtn.style.display = "none";
    }
  });

  searchBtn.addEventListener('click', async () => {
    const keyword = searchKeyword.value.trim();
    if(!keyword) return alert("검색어를 입력해 주세요.");

    setStatus("실시간 수집 채널을 연동 중입니다...");
    newsList.innerHTML = "뉴스 데이터를 로드하고 있습니다...";
    newsList.style.display = "block";

    try {
      const googleNewsUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(keyword + " 경제")}&hl=ko&gl=KR&ceid=KR:ko`;
      const targetUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(googleNewsUrl)}`;
      
      const response = await fetch(targetUrl);
      const data = await response.json();
      
      if (data.status !== "ok") throw new Error("CORS 블록 제어 감지");

      const items = data.items;
      newsList.innerHTML = "";

      if(!items || items.length === 0) {
        newsList.innerHTML = "<div class='news-item'>매칭된 뉴스가 없습니다.</div>";
        return;
      }

      const limit = Math.min(items.length, 7);
      for(let i = 0; i < limit; i++) {
        const title = items[i].title || "무제 기사";
        const link = items[i].link || "#";
        const pubDate = items[i].pubDate ? items[i].pubDate.substring(0, 10) : "기록 없음";
        
        const div = document.createElement('div');
        div.className = 'news-item';
        div.innerHTML = `<strong>${title}</strong><br><small style="color:#666">${pubDate}</small>`;
        
        div.onclick = () => {
          document.querySelectorAll('.news-item').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          selectedNews = { title, link, isUrlOnly: false };
          gptBtn.disabled = false;
          setStatus(`선택된 뉴스: ${title}`);
        };
        newsList.appendChild(div);
      }
      setStatus("자동 매칭 수집 완료.");
    } catch (e) {
      newsList.innerHTML = "<div class='news-item' style='color:#c62828; font-weight:bold;'>⚠️ 검색 채널이 차단되었습니다. 하단 직접 입력에 URL 기사 링크를 붙여넣으세요!</div>";
      setStatus("CORS로 자동 픽업 실패. 아래 수동 링크 삽입 기능을 이용하세요.");
    }
  });

  directApplyBtn.addEventListener('click', () => {
    let title = directTitleInput.value.trim();
    const url = directUrlInput.value.trim();
    
    if(!title && !url) return alert("뉴스 제목이나 URL 기사 주소 중 최소 하나는 채워주세요!");
    
    let isUrlOnlyMode = false;
    if(!title && url) {
      isUrlOnlyMode = true;
      try {
        const urlObj = new URL(url);
        title = `${urlObj.hostname} 제공 링크 기사`;
      } catch (err) {
        title = "사용자 직접 복사 링크 뉴스";
      }
    }

    const finalUrl = url ? url : `https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(title)}`;
    selectedNews = { title: title, link: finalUrl, isUrlOnly: isUrlOnlyMode };
    
    gptBtn.disabled = false; 
    setStatus(`[수동 지정 완료]: ${title}`);
    alert(`"${title}" 데이터 선택 완료! 3번 버튼을 눌러보세요.`);
  });

  gptBtn.addEventListener('click', async () => {
    if(!selectedNews) return;
    setStatus("OpenAI 엔진을 호출하여 해설을 빌드하는 중...");
    explanationOutput.textContent = "인공지능 해설사가 실시간으로 작성하는 중입니다. 잠시만 기다려 주세요...";
    gptBtn.disabled = true;

    try {
      let prompt = "";
      if (selectedNews.isUrlOnly) {
        prompt = `너는 친절하고 전문적인 경제 뉴스 해설사야. 사용자가 특정 경제 뉴스 기사의 주소(${selectedNews.link})를 제공했어. 이 주소를 참고하거나 최신 트렌드를 반영하여 고등학생도 이해할 수 있는 유익한 경제 상식 및 뉴스 해설을 3문장 이내로 명쾌하게 설명해줘.`;
      } else {
        prompt = `너는 친절하고 전문적인 경제 뉴스 해설사야. 다음 경제 뉴스의 제목을 보고, 고등학생도 직관적으로 이해할 수 있도록 쉬운 예시를 들어 3문장 이내로 명쾌하게 설명해줘.\n\n뉴스 제목: ${selectedNews.title}`;
      }
      
      const proxyUrl = "https://corsproxy.io/?"; 
      const targetUrl = "https://api.openai.com/v1/chat/completions";

      const gptResponse = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + OPENAI_API_KEY
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.7
        })
      });

      const gptData = await gptResponse.json();
      if(gptData.error) throw new Error(gptData.error.message);

      currentExplanation = gptData.choices[0].message.content.trim();
      explanationOutput.textContent = currentExplanation;
      
      await generateTTS(currentExplanation);
      
      saveBtn.disabled = false;
      gptBtn.disabled = false;
    } catch(e) {
      console.error(e);
      explanationOutput.textContent = "GPT 빌드 실패: " + e.message;
      gptBtn.disabled = false;
    }
  });

  async function generateTTS(text) {
    setStatus("AI 브리핑 파일을 생성 중...");
    try {
      const proxyUrl = "https://corsproxy.io/?"; 
      const targetUrl = "https://api.openai.com/v1/audio/speech";

      const ttsResponse = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + OPENAI_API_KEY
        },
        body: JSON.stringify({ model: "tts-1", input: text, voice: "alloy" })
      });

      if (!ttsResponse.ok) throw new Error("오디오 서버 응답 거부");

      const audioBlob = await ttsResponse.blob();
      ttsAudio.src = URL.createObjectURL(audioBlob);
      audioPlayerContainer.style.display = "block";
      setStatus("모든 AI 요약 브리핑 셋업이 완료되었습니다!");
    } catch(e) {
      setStatus("오디오 가이드 빌드 실패");
    }
  }

  saveBtn.addEventListener('click', async () => {
    if(!selectedNews || !currentExplanation) return;
    setStatus("파이어베이스 보관함에 기록 중...");
    saveBtn.disabled = true;

    try {
      const dbRef = ref(database, 'news_notes');
      await push(dbRef, {
        userEmail: currentUser ? currentUser.email : "guest_user",
        newsTitle: selectedNews.title,
        newsLink: selectedNews.link,
        explanation: currentExplanation,
        savedAt: new Date().toISOString()
      });
      alert("나만의 경제 해설 노트에 안전하게 보관되었습니다.");
      setStatus("데이터베이스 저장 완료.");
    } catch(e) {
      alert("보관 실패: " + e.message);
      saveBtn.disabled = false;
    }
  });
</script>
</body>
</html>
